services:
  mysql:
    image: mysql:8.0
    container_name: mysql_oxide_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - oxide_network
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}"'
      interval: 10s
      timeout: 5s
      retries: 10

  oxide_api:
    build: .
    container_name: oxide_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__OxideDbConnection: >-
        Server=localhost;
        Port=3306;
        Database=${MYSQL_DATABASE};
        User=${MYSQL_USER};
        Password=${MYSQL_PASSWORD};

    expose:
      - "8080"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - oxide_network

  nginx:
    image: nginx:alpine
    container_name: oxide_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - oxide_api

    networks:
      - oxide_network

volumes:
  mysql_data:

networks:
  oxide_network:
    driver: bridge